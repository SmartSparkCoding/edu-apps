<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Education apps by SmartSparkCoding">
  <title>Edu Apps</title>

  <style>
    :root {
      --bg: #f7faf8;
      --surface: #ffffff;
      --text: #10231d;
      --muted: #66756f;
      --border: #e3ebe7;
      --green: #176b58;
      --green-dark: #0f5143;
      --green-soft: #e8f3ef;
      --shadow: 0 8px 30px rgba(16, 35, 29, 0.06);
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family:
        Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont,
        "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      width: min(1120px, calc(100% - 40px));
      margin: 0 auto;
    }

    header {
      padding: 72px 0 42px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 18px;
      padding: 7px 11px;
      border: 1px solid #d9e9e3;
      border-radius: 999px;
      background: var(--green-soft);
      color: var(--green-dark);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green);
    }

    h1 {
      margin: 0;
      max-width: 760px;
      font-size: clamp(42px, 7vw, 76px);
      line-height: .98;
      letter-spacing: -0.055em;
      font-weight: 760;
    }

    .intro {
      max-width: 620px;
      margin: 20px 0 0;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.65;
    }

    main {
      padding-bottom: 80px;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 24px;
    }

    .count {
      color: var(--muted);
      font-size: 14px;
      font-weight: 600;
    }

    .refresh {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 9px 13px;
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      font: inherit;
      font-size: 13px;
      font-weight: 650;
      transition: .18s ease;
    }

    .refresh:hover {
      border-color: #c8dbd4;
      background: #fbfdfc;
      transform: translateY(-1px);
    }

    .refresh:disabled {
      opacity: .6;
      cursor: wait;
      transform: none;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
    }

    .card {
      display: flex;
      flex-direction: column;
      min-height: 210px;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow);
      transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: #cbded7;
      box-shadow: 0 14px 38px rgba(16, 35, 29, 0.10);
    }

    .card-image {
      width: 100%;
      height: 150px;
      object-fit: cover;
      display: block;
      background: var(--green-soft);
    }

    .card-body {
      display: flex;
      flex: 1;
      flex-direction: column;
      padding: 20px;
    }

    .route {
      display: inline-flex;
      align-items: center;
      align-self: flex-start;
      max-width: 100%;
      margin-bottom: 12px;
      padding: 6px 9px;
      overflow: hidden;
      border-radius: 8px;
      background: #f1f5f3;
      color: var(--green-dark);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      font-weight: 650;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .title {
      margin: 0;
      font-size: 20px;
      line-height: 1.2;
      letter-spacing: -0.02em;
    }

    .description {
      margin: 9px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
    }

    .date {
      margin-top: auto;
      padding-top: 18px;
      color: #82908b;
      font-size: 12px;
    }

    .empty,
    .error,
    .loading {
      padding: 40px 20px;
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, .65);
      color: var(--muted);
      text-align: center;
    }

    .error {
      border-color: #ead9d9;
      color: #8b4c4c;
    }

    .skeleton {
      min-height: 210px;
      border-radius: var(--radius);
      background:
        linear-gradient(
          100deg,
          #edf2ef 20%,
          #f7faf8 40%,
          #edf2ef 60%
        );
      background-size: 200% 100%;
      animation: shimmer 1.3s infinite;
    }

    @keyframes shimmer {
      to { background-position: -200% 0; }
    }

    footer {
      padding: 26px 0 40px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 13px;
    }

    footer a {
      color: var(--green);
      font-weight: 650;
    }

    @media (max-width: 850px) {
      .grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 580px) {
      .container {
        width: min(100% - 28px, 1120px);
      }

      header {
        padding-top: 48px;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .toolbar {
        align-items: flex-start;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="container">
      <div class="eyebrow">Edu Apps</div>
      <h1>Explore the apps.</h1>
      <p class="intro">
        A simple collection of educational projects. Every card below is
        automatically discovered from the routes in the repository.
      </p>
    </div>
  </header>

  <main>
    <div class="container">
      <div class="toolbar">
        <span class="count" id="count">Finding apps…</span>
        <button class="refresh" id="refresh" type="button">Refresh</button>
      </div>

      <div id="status" class="loading">Loading routes…</div>
      <div id="grid" class="grid" hidden></div>
    </div>
  </main>

  <footer>
    <div class="container">
      Built by
      <a href="https://github.com/smartsparkcoding" target="_blank" rel="noopener">
        SmartSparkCoding
      </a>
      ·
      <a href="https://github.com/smartsparkcoding/edu-apps" target="_blank" rel="noopener">
        View repository
      </a>
    </div>
  </footer>

  <script>
    /*
      Repository:
      https://github.com/smartsparkcoding/edu-apps

      A route is simply a top-level folder in the repository.

      Optional metadata:
        /my-app/info.txt

      Example info.txt:
        title: Maths Game
        description: A quick maths practice game.
        image: /my-app/preview.png
        date: 2026-09-08

      Or:
        /my-app/info.js

      Example info.js:
        window.routeInfo = {
          title: "Maths Game",
          description: "A quick maths practice game.",
          image: "preview.png",
          date: "2026-09-08"
        };

      Supported aliases:
        image / imageRoute / image_route
        title
        description
        date / dateAdded / date_added
    */

    const OWNER = "smartsparkcoding";
    const REPO = "edu-apps";
    const BRANCH = "main";

    const API_ROOT =
      `https://api.github.com/repos/${OWNER}/${REPO}`;

    const RAW_ROOT =
      `https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}`;

    const SITE_ROOT = "https://edu.navaratne.uk";

    const grid = document.getElementById("grid");
    const status = document.getElementById("status");
    const count = document.getElementById("count");
    const refreshButton = document.getElementById("refresh");

    function escapeHTML(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function normaliseMetadata(data) {
      if (!data || typeof data !== "object") return {};

      return {
        title: data.title ?? "",
        description: data.description ?? "",
        image:
          data.image ??
          data.imageRoute ??
          data.image_route ??
          "",
        date:
          data.date ??
          data.dateAdded ??
          data.date_added ??
          ""
      };
    }

    function parseInfoText(text) {
      const result = {};

      for (const rawLine of text.split(/\r?\n/)) {
        const line = rawLine.trim();

        if (!line || line.startsWith("#")) continue;

        const separator = line.indexOf(":");
        if (separator === -1) continue;

        const key = line.slice(0, separator).trim().toLowerCase();
        const value = line.slice(separator + 1).trim();

        if (!value) continue;

        if (key === "title") result.title = value;
        if (key === "description") result.description = value;
        if (key === "image" || key === "image route") result.image = value;
        if (key === "date" || key === "date added") result.date = value;
      }

      return result;
    }

    function parseInfoJS(text) {
      /*
        info.js is intentionally parsed without executing arbitrary code.

        It accepts common formats such as:
          window.routeInfo = { ... };
          const routeInfo = { ... };
          routeInfo = { ... };

        The values can be strings or quoted strings.
      */

      const result = {};
      const fields = {
        title: /(?:title)\s*:\s*["'`]([^"'`]*)["'`]/i,
        description: /(?:description)\s*:\s*["'`]([^"'`]*)["'`]/i,
        image: /(?:image|imageRoute|image_route)\s*:\s*["'`]([^"'`]*)["'`]/i,
        date: /(?:date|dateAdded|date_added)\s*:\s*["'`]([^"'`]*)["'`]/i
      };

      for (const [key, regex] of Object.entries(fields)) {
        const match = text.match(regex);
        if (match) result[key] = match[1];
      }

      return result;
    }

    async function fetchOptional(url) {
      try {
        const response = await fetch(url, {
          cache: "no-store"
        });

        if (!response.ok) return null;
        return await response.text();
      } catch {
        return null;
      }
    }

    async function getMetadata(route) {
      const infoTextURL =
        `${RAW_ROOT}/${encodeURIComponent(route)}/info.txt`;

      const infoJSURL =
        `${RAW_ROOT}/${encodeURIComponent(route)}/info.js`;

      const infoText = await fetchOptional(infoTextURL);

      if (infoText !== null) {
        return parseInfoText(infoText);
      }

      const infoJS = await fetchOptional(infoJSURL);

      if (infoJS !== null) {
        return parseInfoJS(infoJS);
      }

      return {};
    }

    function resolveAsset(route, value) {
      if (!value) return "";

      value = value.trim();

      if (/^https?:\/\//i.test(value)) {
        return value;
      }

      if (value.startsWith("/")) {
        return `${SITE_ROOT}${value}`;
      }

      return `${RAW_ROOT}/${encodeURIComponent(route)}/${value
        .split("/")
        .map(encodeURIComponent)
        .join("/")}`;
    }

    function routeURL(route) {
      return `${SITE_ROOT}/${route
        .split("/")
        .map(encodeURIComponent)
        .join("/")}/`;
    }

    function createCard(route, metadata) {
      const data = normaliseMetadata(metadata);

      const title = data.title || "";
      const description = data.description || "";
      const image = resolveAsset(route, data.image);
      const date = data.date || "";

      const card = document.createElement("a");
      card.className = "card";
      card.href = routeURL(route);

      const imageHTML = image
        ? `<img class="card-image" src="${escapeHTML(image)}"
             alt="" loading="lazy"
             onerror="this.remove()">`
        : "";

      const titleHTML = title
        ? `<h2 class="title">${escapeHTML(title)}</h2>`
        : "";

      const descriptionHTML = description
        ? `<p class="description">${escapeHTML(description)}</p>`
        : "";

      const dateHTML = date
        ? `<div class="date">Added ${escapeHTML(date)}</div>`
        : "";

      card.innerHTML = `
        ${imageHTML}
        <div class="card-body">
          <span class="route">/${escapeHTML(route)}</span>
          ${titleHTML}
          ${descriptionHTML}
          ${dateHTML}
        </div>
      `;

      return card;
    }

    async function getRoutes() {
      const response = await fetch(
        `${API_ROOT}/contents/?ref=${encodeURIComponent(BRANCH)}`,
        {
          headers: {
            Accept: "application/vnd.github+json"
          },
          cache: "no-store"
        }
      );

      if (!response.ok) {
        if (response.status === 403) {
          throw new Error(
            "GitHub API rate limit reached. Please try again shortly."
          );
        }

        if (response.status === 404) {
          throw new Error(
            "The repository or branch could not be found."
          );
        }

        throw new Error(
          `GitHub returned HTTP ${response.status}.`
        );
      }

      const items = await response.json();

      /*
        Only directories are treated as routes.
        The site HTML itself, README, .github, etc. are ignored.
      */
      return items
        .filter(item => item.type === "dir")
        .map(item => item.name)
        .filter(name => !name.startsWith("."))
        .filter(name => name !== "node_modules")
        .sort((a, b) => a.localeCompare(b));
    }

    async function load() {
      refreshButton.disabled = true;
      grid.hidden = true;
      grid.replaceChildren();

      status.hidden = false;
      status.className = "loading";
      status.textContent = "Finding routes…";
      count.textContent = "Finding apps…";

      try {
        const routes = await getRoutes();

        if (!routes.length) {
          status.className = "empty";
          status.textContent = "No routes were found.";
          count.textContent = "0 apps";
          return;
        }

        count.textContent =
          `${routes.length} ${routes.length === 1 ? "app" : "apps"}`;

        status.hidden = true;
        grid.hidden = false;

        /*
          Fetch metadata in parallel. If info.txt/info.js does not exist,
          the route still gets a card with only its route displayed.
        */
        const cards = await Promise.all(
          routes.map(async route => {
            const metadata = await getMetadata(route);
            return createCard(route, metadata);
          })
        );

        for (const card of cards) {
          grid.appendChild(card);
        }
      } catch (error) {
        console.error(error);

        status.className = "error";
        status.textContent =
          error instanceof Error
            ? error.message
            : "Something went wrong while loading the routes.";

        count.textContent = "Unable to load";
      } finally {
        refreshButton.disabled = false;
      }
    }

    refreshButton.addEventListener("click", load);

    load();
  </script>
</body>
</html>
