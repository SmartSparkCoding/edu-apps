<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>English Spelling Trainer</title>
<style>
    body {
        margin: 0;
        background: #fafafa;
        color: #222;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        height: 100vh;
        display: flex;
        flex-direction: column;
    }

    /* Top progress bar */
    #progress {
        height: 6px;
        background: #e5e5e5;
        width: 100%;
    }
    #progressBar {
        height: 100%;
        width: 0%;
        background: #4a90e2;
        transition: width 0.2s ease;
    }

    /* Page container */
    #page {
        flex: 1;
        display: flex;
        flex-direction: column;
        padding: 40px;
        max-width: 900px;
        margin: 0 auto;
    }

    h1 {
        font-size: 42px;
        font-weight: 600;
        margin-bottom: 20px;
    }

    h2 {
        font-size: 28px;
        margin-top: 40px;
        margin-bottom: 10px;
    }

    button {
        padding: 12px 22px;
        font-size: 16px;
        border-radius: 8px;
        border: 1px solid #ccc;
        background: #fff;
        cursor: pointer;
        transition: background 0.15s;
        margin-right: 10px;
    }
    button:hover {
        background: #f0f0f0;
    }

    input, textarea {
        width: 100%;
        padding: 12px;
        margin-top: 8px;
        border-radius: 8px;
        border: 1px solid #ccc;
        font-size: 16px;
    }

    /* Collapsible sections */
    details {
        background: #fff;
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 14px 18px;
        margin-top: 20px;
    }
    summary {
        font-size: 18px;
        cursor: pointer;
        outline: none;
    }

    /* Set list */
    .setItem {
        padding: 12px;
        border: 1px solid #ddd;
        background: #fff;
        margin-top: 8px;
        cursor: pointer;
        border-radius: 6px;
        font-size: 18px;
    }
    .setItem:hover {
        background: #f0f0f0;
    }

    /* Test word display */
    #wordDisplay {
        font-size: 64px;
        font-weight: 600;
        margin-top: 80px;
        text-align: center;
        display: none;
    }

    #mode {
        margin-top: 20px;
        font-size: 16px;
        color: #777;
        text-align: center;
    }
</style>
</head>
<body>

<div id="progress"><div id="progressBar"></div></div>

<div id="page"></div>

<script>
/* ------------------------------
   DATA + STATE
------------------------------ */
let sets = JSON.parse(localStorage.getItem("spelling_sets") || "[]");
let order = [];
let index = 0;
let mode = "idle";
let currentSet = null;

let englishVoice = null;

/* ------------------------------
   VOICE SELECTION (FORCED ENGLISH)
------------------------------ */
function loadVoices() {
    const voices = speechSynthesis.getVoices();
    englishVoice = voices.find(v => v.lang.toLowerCase().includes("en"));
    if (!englishVoice) setTimeout(loadVoices, 200);
}
speechSynthesis.onvoiceschanged = loadVoices;
loadVoices();

function speak(text) {
    if (!englishVoice) loadVoices();
    const utter = new SpeechSynthesisUtterance(text);
    utter.voice = englishVoice;
    utter.lang = "en-US";
    utter.rate = 0.95;
    speechSynthesis.cancel();
    speechSynthesis.speak(utter);
}

/* ------------------------------
   PAGE RENDERING
------------------------------ */
const page = document.getElementById("page");

function showHome() {
    page.innerHTML = `
        <h1>English Spelling Trainer</h1>
        <button onclick="showCreate()">Create Set</button>
        <button onclick="showChoose()">Start Test</button>
        <button onclick="startReview()">Review</button>
        <button onclick="moveOn()">Move On</button>
        <div id="mode">Idle</div>
    `;
}

function showCreate() {
    page.innerHTML = `
        <h1>Create a Spelling Set</h1>

        <details open>
            <summary>New Set</summary>
            <input id="setName" placeholder="Set name (e.g., Week 3)">
            <textarea id="setWords" rows="6" placeholder="One spelling per line"></textarea>
            <button onclick="saveSet()">Save Set</button>
        </details>

        <details>
            <summary>Existing Sets</summary>
            <div id="setList"></div>
        </details>

        <button onclick="showHome()">Back</button>
    `;
    renderSetList();
}

function showChoose() {
    page.innerHTML = `
        <h1>Select a Set</h1>
        <div id="setList"></div>
        <button onclick="showHome()">Back</button>
    `;
    renderSetList();
}

function showTestUI() {
    page.innerHTML = `
        <h1>${currentSet.name}</h1>
        <div id="wordDisplay"></div>

        <div style="margin-top:40px;">
            <button onclick="prevWord()">Back</button>
            <button onclick="nextWord()">Next</button>
            <button onclick="startReview()">Review</button>
            <button onclick="moveOn()">Move On</button>
        </div>

        <div id="mode">${mode}</div>
    `;
}

/* ------------------------------
   SET LIST RENDERING
------------------------------ */
function renderSetList() {
    const list = document.getElementById("setList");
    if (!list) return;

    list.innerHTML = "";
    [...sets].reverse().forEach(set => {
        const div = document.createElement("div");
        div.className = "setItem";
        div.textContent = `${set.name} (${set.words.length} words)`;
        div.onclick = () => startTest(set);
        list.appendChild(div);
    });
}

/* ------------------------------
   SET CREATION
------------------------------ */
function saveSet() {
    const name = document.getElementById("setName").value.trim();
    const words = document.getElementById("setWords").value.trim().split("\n").map(w => w.trim()).filter(w => w);

    if (!name || words.length === 0) return;

    sets.push({ name, words });
    localStorage.setItem("spelling_sets", JSON.stringify(sets));
    showCreate();
}

/* ------------------------------
   TEST MODE
------------------------------ */
function startTest(set) {
    currentSet = set;
    order = set.words.map((_, i) => i).sort(() => Math.random() - 0.5);
    index = 0;
    mode = "test";

    localStorage.setItem("spelling_session", JSON.stringify({
        setName: set.name,
        order
    }));

    showTestUI();
    speak(set.words[order[index]]);
    updateProgress();
}

function nextWord() {
    if (index < order.length - 1) index++;
    updateTestDisplay();
}

function prevWord() {
    if (index > 0) index--;
    updateTestDisplay();
}

function updateTestDisplay() {
    const wordDisplay = document.getElementById("wordDisplay");
    if (mode === "test") {
        wordDisplay.style.display = "none";
        speak(currentSet.words[order[index]]);
    } else {
        wordDisplay.style.display = "block";
        wordDisplay.textContent = currentSet.words[order[index]];
    }
    updateProgress();
}

/* ------------------------------
   REVIEW MODE
------------------------------ */
function startReview() {
    const session = JSON.parse(localStorage.getItem("spelling_session") || "null");
    if (!session) return;

    const set = sets.find(s => s.name === session.setName);
    if (!set) return;

    currentSet = set;
    order = session.order;
    index = 0;
    mode = "review";

    showTestUI();
    updateTestDisplay();
}

/* ------------------------------
   MOVE ON
------------------------------ */
function moveOn() {
    localStorage.removeItem("spelling_session");
    mode = "idle";
    index = 0;
    progressBar.style.width = "0%";
    showHome();
}

/* ------------------------------
   PROGRESS BAR
------------------------------ */
function updateProgress() {
    const pct = ((index + 1) / order.length) * 100;
    progressBar.style.width = pct + "%";
}

/* ------------------------------
   KEYBOARD CONTROLS
------------------------------ */
document.addEventListener("keydown", e => {
    if (mode === "idle") return;

    if (e.code === "Space" || e.code === "ArrowRight") {
        e.preventDefault();
        nextWord();
    }
    if (e.code === "ArrowLeft") {
        prevWord();
    }
    if (e.key === "r" || e.key === "R") {
        speak(currentSet.words[order[index]]);
    }
});

/* ------------------------------
   INITIAL LOAD
------------------------------ */
showHome();
</script>

</body>
</html>
